name: update

# 1日2回、公式サイトから取得して data.json を更新する
on:
  schedule:
    # GitHub ActionsはUTCで動く。日本時間の9:10と21:10にあたる
    - cron: '10 0 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:        # 手動実行のボタンが出る

permissions:
  contents: write           # data.json をコミットするために必要

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 公式サイトから取得
        env:
          WEB_DIR: .
          STORES: ./stores.json
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
          LINE_ADD_URL: ${{ vars.LINE_ADD_URL }}
          DETECT_STORES: '1'
        run: python3 scrape_pokeca.py

      - name: ワンピースカードを取得
        continue-on-error: true      # 片方が失敗してももう片方は更新する
        env:
          WEB_DIR: .
          STORES_OP: ./stores_onepiece.json
        run: python3 scrape_onepiece.py

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json .state.json data_onepiece.json .state_onepiece.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
